image: node:22-alpine

stages:
  - validate
  - test
  - build
  - e2e
  - mutation

validate:
  stage: validate
  script:
    - echo "Validating static site structure..."
    - test -f index.html && echo "  ✅ index.html"
    - test -f styles.css && echo "  ✅ styles.css"
    - test -f script.js && echo "  ✅ script.js"
    - test -d data && echo "  ✅ data/"
    - test -f data/services.yaml && echo "  ✅ data/services.yaml"
    - test -d docs && echo "  ✅ docs/"
    - echo "✅ Static site validated"

test-unit:
  stage: test
  before_script:
    - npm ci
  script:
    - echo "Running unit + property tests..."
    - npm run test:unit
    - echo "Running coverage (thresholds enforced in vitest.config)..."
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 7 days

build:
  stage: build
  before_script:
    # node:22-alpine ships no git — needed for the staleness check below
    - apk add --no-cache git
    - npm ci
  script:
    - node scripts/generate-data.js
    - echo "Checking generated data is up to date..."
    - git diff --exit-code data/services.js || (echo "❌ data/services.js is stale — run 'npm run build'"; exit 1)
    - echo "✅ data/services.js matches data/services.yaml"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"

test-e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.62.1-jammy
  script:
    - npm ci
    - echo "Running browser E2E + accessibility (axe-core)..."
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"

test-mutation:
  stage: mutation
  before_script:
    - npm ci
  script:
    - echo "Running mutation testing (Stryker) — measures test-suite effectiveness..."
    - npx stryker run
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
